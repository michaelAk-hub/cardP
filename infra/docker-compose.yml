# Local development infrastructure for Blue Card.
# Brings up the two backing services the foundation needs: PostgreSQL + Redis.
# Application containers (api, worker, admin, nginx) are added at the deploy
# milestone (spec §10) in a separate prod compose file.
#
#   docker compose -f infra/docker-compose.yml up -d
#
# Values default to the local-dev credentials in .env.example.

services:
  postgres:
    image: postgres:16-alpine
    container_name: bluecard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bluecard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bluecard}
      POSTGRES_DB: ${POSTGRES_DB:-bluecard}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - bluecard_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-bluecard}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bluecard-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - bluecard_redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bluecard_pgdata:
  bluecard_redisdata:
